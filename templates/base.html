{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Floral Art by Prathyusha</title>
    <!-- Favicon -->
    <link href="/assets/img/brand/favicon.png" rel="icon" type="image/png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
    <!-- Icons -->
    <link href="{% static '/assets/css/nucleo-icons.css' %}" rel="stylesheet">
    <script src="https://kit.fontawesome.com/7c9b2f9ca1.js" crossorigin="anonymous"></script>
    <!-- Material Kit-->
    <link type="text/css" href="{% static '/assets/css/material-kit.min.css' %}" rel="stylesheet">
    <style>
        body{
            background-color: #FFC0CB !important;
            background-image: url("{% static 'assets/img/floral_home.jpg' %}");
        }
        .container-replica{
            padding: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left: 20px;
            margin-right: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4.4px);
            -webkit-backdrop-filter: blur(4.4px);
            border: 1px solid rgba(255, 255, 255, 0.29);
        }
        .products-list-card{
            margin-bottom: 50px !important;
        }
        .floating-cart-button {
          background-color: transparent;
          position: fixed;
          border-radius: 50px;
          bottom: 40px;
          right: 10px;
          border: none;
          width: 60px;
          height: 60px;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          z-index: 1000;
        }
        #search-results {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            max-height: 300px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: none;
            z-index: 10;
        }
        .search-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.3s;
        }
        .search-item:hover {
            background: #f4f4f4;
        }
        .search-item:last-child {
            border-bottom: none;
        }
    </style>
    {% block static %} {% endblock %}
  </head>
  <body>
    {% block nav_bar %}
        {% include 'nav_bar.html' %}
    {% endblock %}
    {% block search_content %}
    {% endblock %}
    {% block content %}
    {% endblock %}
    <div class="floating-cart-button">
      <a class="nav-link nav-link-icon  text-primary position-relative" href="/checkout/" >
        <i class="fa-solid fa-cart-shopping"></i>
        <p class="d-inline text-sm z-index-1 font-weight-bold" data-bs-toggle="tooltip" data-bs-placement="bottom">
            &nbsp;&nbsp;
            <span id="cartValue2" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary badge badge-sm badge-circle badge-danger border border-white border-2">
                0
              <span class="visually-hidden"></span>
            </span>
        </p>
      </a>
    </div>
    <!--   Core JS Files   -->
    <script src="{% static '/assets/js/core/popper.min.js' %}" type="text/javascript"></script>
    <script src="{% static '/assets/js/core/bootstrap.min.js' %}" type="text/javascript"></script>
    <script src="{% static '/assets/js/plugins/perfect-scrollbar.min.js' %}" type="text/javascript"></script>
    <script src="{% static '/assets/js/plugins/moment.min.js' %}"></script>
    <!--	Plugin for Select, full documentation here: https://joshuajohnson.co.uk/Choices/ -->
    <script src="{% static '/assets/js/plugins/choices.min.js' %}" type="text/javascript"></script>
    <!-- Control Center for Material Kit parallax effects, scripts for the example pages etc -->
    <script src="{% static '/assets/js/material-kit.min.js' %}" type="text/javascript"></script>
    <script src="{% static '/assets/js/base.js' %}" type="text/javascript"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            cart_items_length = Object.keys(cart).length;
            document.getElementById("cartValue").textContent = cart_items_length;
            document.getElementById("cartValue2").textContent = cart_items_length;
        })
    </script>
    <script type="text/javascript">
          // Load data from Django context
          const subcategories = {{ subcategories|safe }};
          const products = {{ products|safe }};
          let allData = [];

          // Combine data for searching
          allData = [
              ...subcategories.map(item => ({ ...item, type: 'Collection', url: `/collections/${item.str_id}/` })),
              ...products.map(item => ({ ...item, type: 'Product', url: `/product/${item.str_id}/` })),
          ];

          const searchBox = document.getElementById('search-box');
          const searchResults = document.getElementById('search-results');

          // Handle search dynamically
          searchBox.addEventListener('input', () => {
              console.log(allData);
              const query = searchBox.value.toLowerCase();
              searchResults.innerHTML = ''; // Clear previous results
              searchResults.style.display = query ? 'block' : 'none';

              if (query) {
                  // Filter data
                  const results = allData.filter(item => item.name.toLowerCase().includes(query));
                  results.forEach(result => {
                      const div = document.createElement('div');
                      div.classList.add('search-item');
                      div.innerHTML = `<strong>${result.name}</strong> (${result.type})`;
                      div.addEventListener('click', () => {
                          window.location.href = result.url; // Redirect on click
                      });
                      searchResults.appendChild(div);
                  });
              }
          });

          // Close dropdown when clicking outside
          document.addEventListener('click', (e) => {
              if (!searchResults.contains(e.target) && e.target !== searchBox) {
                  searchResults.style.display = 'none';
              }
          });
      </script>
  </body>
</html>
